configuration:
  design:
    name: Design
    description: Look of the web interface – modern or classic terminal.
  theme:
    name: Color scheme
    description: Dark or light mode.
  download_dir:
    name: Download folder
    description: Folder where files are saved (e.g. /media/downloads or /share/downloads).
  inkbox_api_key:
    name: Inkbox API key
    description: API key of your Inkbox identity, needed for iMessage notifications.
  imessage_to:
    name: iMessage recipient
    description: Your phone number, e.g. +491701234567. Notifications are sent there when a download finishes or fails.
network:
  8099/tcp: Web interface and API on your home network (e.g. for the Inkbox Claude Gateway)
