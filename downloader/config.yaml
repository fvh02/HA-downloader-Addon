name: Downloader
version: "1.4.0"
slug: downloader
description: Warteschlange für Datei-Downloads mit moderner Weboberfläche
url: https://github.com/fvh02/HA-downloader-Addon
image: ghcr.io/fvh02/{arch}-ha-downloader
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:download-circle
panel_title: Downloader
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Weboberfläche und API im Heimnetz (z. B. für das Inkbox Claude Gateway)
map:
  - media:rw
  - share:rw
options:
  design: modern
  theme: dark
  download_dir: /media/downloads
  inkbox_api_key: ""
  imessage_to: ""
  access_code: ""
schema:
  design: list(modern|terminal)
  theme: list(dark|light)
  download_dir: str
  inkbox_api_key: password?
  imessage_to: match(^(\+[1-9][0-9]{6,14})?$)?
  access_code: password?
