configuration:
  design:
    name: Design
    description: Aussehen der Weboberfläche – modern oder klassischer Terminal-Look.
  theme:
    name: Farbschema
    description: Dunkler (dark) oder heller (light) Modus.
  download_dir:
    name: Download-Ordner
    description: Ordner, in dem die Dateien gespeichert werden (z. B. /media/downloads oder /share/downloads).
  api_token:
    name: API-Token
    description: Schaltet den direkten Zugriff über Port 8100 frei (z. B. für deinen Assistenten). Leer lassen, wenn du nur die Seitenleiste nutzt.
  inkbox_api_key:
    name: Inkbox API-Key
    description: API-Key deiner Inkbox-Identität. Wird für iMessage-Benachrichtigungen benötigt.
  imessage_to:
    name: iMessage-Empfänger
    description: Deine Handynummer im Format +491701234567. Dorthin gehen die Benachrichtigungen, wenn ein Download fertig ist oder fehlschlägt.
network:
  8100/tcp: Direkter Zugriff mit API-Token (z. B. für deinen Assistenten)
