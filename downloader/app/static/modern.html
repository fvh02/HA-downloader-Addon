<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloader</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --bg-glow: #dfe7ff;
      --surface: #ffffff;
      --surface-hover: #f3f5fa;
      --border: #e3e7f0;
      --text: #1b1f2a;
      --muted: #6b7385;
      --accent: #4f6bff;
      --accent-hover: #3d58eb;
      --accent-soft: #eaeeff;
      --success: #1f9d61;
      --danger: #e5484d;
      --danger-soft: #fdecec;
      --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 8px 28px rgba(20, 30, 60, .10);
    }
    :root[data-theme="dark"] {
      --bg: #111318;
      --bg-glow: #1c2340;
      --surface: #1b1e26;
      --surface-hover: #232733;
      --border: #2c313d;
      --text: #e8eaf0;
      --muted: #9097a8;
      --accent: #6f86ff;
      --accent-hover: #8496ff;
      --accent-soft: #252c4a;
      --success: #3ccf8e;
      --danger: #ff6b70;
      --danger-soft: #3a1f23;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 32px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, var(--bg-glow), transparent 70%), var(--bg);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0 16px;
    }
    main {
      width: 100%;
      max-width: 680px;
      margin-top: min(22vh, 200px);
      padding-bottom: 48px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-logo {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      box-shadow: 0 6px 20px rgba(79, 107, 255, .35);
    }
    .brand h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    /* Search-bar style input */
    .search {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 6px 6px 20px;
      box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s, border-radius .15s;
    }
    .search:focus-within {
      border-color: var(--accent);
      box-shadow: var(--shadow), 0 0 0 4px var(--accent-soft);
    }
    .search.open {
      border-radius: 26px 26px 0 0;
      border-bottom-color: transparent;
      clip-path: inset(-40px -40px 0 -40px);
    }
    .search svg.lead { color: var(--muted); flex: none; }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 1.05rem;
      padding: 12px 4px;
    }
    .search input::placeholder { color: var(--muted); }
    .search button {
      flex: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 12px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .15s, transform .1s;
    }
    .search button:hover { background: var(--accent-hover); }
    .search button:active { transform: scale(.97); }
    .search button:disabled { opacity: .6; cursor: default; }

    .message {
      min-height: 1.4em;
      margin: 10px 20px 0;
      font-size: .9rem;
      color: var(--danger);
    }

    /* Dropdown queue list */
    .panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-top: 1px solid var(--border);
      border-radius: 0 0 26px 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-top: -1px;
      animation: drop .18s ease-out;
    }
    .search:not(:focus-within) + .panel { border-color: var(--border); }
    .panel.open { display: block; }
    @keyframes drop {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 6px;
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
    }
    .panel-head button {
      border: 0; background: none; color: var(--accent);
      font: inherit; text-transform: none; letter-spacing: 0;
      cursor: pointer; padding: 4px 8px; border-radius: 8px;
    }
    .panel-head button:hover { background: var(--accent-soft); }
    ul { list-style: none; margin: 0; padding: 4px 8px 10px; }
    li {
      display: grid;
      grid-template-columns: 40px 1fr auto 40px;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 16px;
      transition: background .12s;
    }
    li:hover { background: var(--surface-hover); }
    .icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: grid; place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
    }
    li.done .icon { color: var(--success); }
    li.error .icon { color: var(--danger); background: var(--danger-soft); }
    .info { min-width: 0; }
    .name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status {
      font-size: .82rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    li.error .status { color: var(--danger); }
    li.done .status { color: var(--success); }
    .bar {
      height: 4px;
      border-radius: 4px;
      background: var(--border);
      margin-top: 6px;
      overflow: hidden;
    }
    .bar span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      border-radius: inherit;
      transition: width .4s;
    }
    .bar.indeterminate span {
      width: 30% !important;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
    .size {
      font-variant-numeric: tabular-nums;
      font-size: .9rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .trash {
      width: 40px; height: 40px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      display: grid; place-items: center;
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    .trash:hover { background: var(--danger-soft); color: var(--danger); }
    .footer {
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
      margin-top: 18px;
    }
    .footer code {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
    }
    @media (max-width: 520px) {
      main { margin-top: 12vh; }
      .search { padding-left: 14px; }
      .search button .label { display: none; }
      .search button { padding: 12px 14px; }
      li { grid-template-columns: 36px 1fr auto 36px; gap: 10px; padding: 10px 6px; }
      .icon, .trash { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="brand-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      </div>
      <h1>Downloader</h1>
    </div>

    <form class="search" id="form" autocomplete="off">
      <svg class="lead" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <input id="url" type="text" placeholder="Link zu einer Datei einfügen …" aria-label="Download-Link" autofocus>
      <button id="add" type="submit">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="label">Hinzufügen</span>
      </button>
    </form>

    <section class="panel" id="panel" aria-live="polite">
      <div class="panel-head">
        <span id="count">Warteliste</span>
        <button id="clear" type="button" hidden>Erledigte entfernen</button>
      </div>
      <ul id="list"></ul>
    </section>

    <div class="message" id="message"></div>
    <div class="footer" id="footer"></div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("url");
    const addBtn = document.getElementById("add");
    const panel = document.getElementById("panel");
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const clearBtn = document.getElementById("clear");
    const message = document.getElementById("message");
    const footer = document.getElementById("footer");

    const ICONS = {
      file: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
      downloading: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>',
      done: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
      error: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>',
      trash: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
    };

    function formatSize(bytes) {
      if (bytes == null) return "–";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0, v = bytes;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return (i === 0 ? v : v.toFixed(v < 10 ? 2 : 1)).toString().replace(".", ",") + " " + units[i];
    }

    function statusText(item, position) {
      switch (item.status) {
        case "downloading": {
          const pct = item.size ? Math.floor(item.downloaded / item.size * 100) + " % · " : "";
          const speed = item.speed ? " · " + formatSize(item.speed) + "/s" : "";
          return "Wird heruntergeladen · " + pct + formatSize(item.downloaded) + speed;
        }
        case "done": return "Fertig";
        case "error": return "Fehler: " + (item.error || "unbekannt");
        default: return position === 0 ? "Als Nächstes" : "In Warteschlange · Position " + (position + 1);
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render(items) {
      const open = items.length > 0;
      panel.classList.toggle("open", open);
      form.classList.toggle("open", open);
      const pending = items.filter(i => i.status === "queued" || i.status === "downloading").length;
      count.textContent = items.length === 1 ? "1 Datei" : items.length + " Dateien";
      if (pending) count.textContent += " · " + pending + " ausstehend";
      clearBtn.hidden = !items.some(i => i.status === "done" || i.status === "error");

      let position = 0;
      list.innerHTML = items.map(item => {
        const pos = item.status === "queued" ? position++ : null;
        const icon = item.status === "done" ? ICONS.done : item.status === "error" ? ICONS.error
          : item.status === "downloading" ? ICONS.downloading : ICONS.file;
        const pct = item.size ? Math.min(100, item.downloaded / item.size * 100) : 0;
        const bar = item.status === "downloading"
          ? `<div class="bar ${item.size ? "" : "indeterminate"}"><span style="width:${pct}%"></span></div>` : "";
        return `<li class="${item.status}" data-id="${item.id}">
          <div class="icon">${icon}</div>
          <div class="info">
            <div class="name" title="${escapeHtml(item.url)}">${escapeHtml(item.name)}</div>
            <div class="status">${escapeHtml(statusText(item, pos))}</div>
            ${bar}
          </div>
          <div class="size">${formatSize(item.size)}</div>
          <button class="trash" type="button" title="Aus der Liste entfernen" aria-label="Entfernen">${ICONS.trash}</button>
        </li>`;
      }).join("");
    }

    async function api(path, options = {}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (!res.ok) throw new Error(await res.text() || res.statusText);
      return res.status === 204 ? null : res.json();
    }

    async function refresh() {
      try {
        const data = await api("api/items");
        render(data.items);
        footer.innerHTML = "Speicherort: <code>" + escapeHtml(data.directory) + "</code>";
      } catch (err) {
        message.textContent = "Verbindung zum Add-on verloren …";
        message.dataset.kind = "connection";
        return;
      }
      if (message.dataset.kind === "connection") { message.textContent = ""; message.dataset.kind = ""; }
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const url = input.value.trim();
      if (!url) { input.focus(); return; }
      addBtn.disabled = true;
      message.textContent = "";
      try {
        await api("api/items", { method: "POST", body: JSON.stringify({ url }) });
        input.value = "";
        await refresh();
      } catch (err) {
        message.textContent = err.message;
      } finally {
        addBtn.disabled = false;
        input.focus();
      }
    });

    list.addEventListener("click", async e => {
      const btn = e.target.closest(".trash");
      if (!btn) return;
      const li = btn.closest("li");
      li.style.opacity = ".4";
      try {
        await api("api/items/" + li.dataset.id, { method: "DELETE" });
      } catch (err) {
        message.textContent = err.message;
      }
      refresh();
    });

    clearBtn.addEventListener("click", async () => {
      await api("api/clear", { method: "POST" });
      refresh();
    });

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
