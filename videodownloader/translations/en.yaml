configuration:
  design:
    name: Design
    description: "glass: frosted glass like the games · modern: clean, bright design · terminal: classic terminal look"
  theme:
    name: Color scheme
    description: Dark or light mode.
  quality:
    name: Default quality
    description: Preselected when adding. "best" = highest available quality, "audio" = sound only as MP3. Can be changed per video.
  download_dir:
    name: Download folder
    description: Where videos are saved; the library shows this folder.
  update_ytdlp:
    name: Update yt-dlp on start
    description: Recommended – YouTube changes often, a current yt-dlp prevents failing downloads.
  access_code:
    name: Access code (internet)
    description: Only asked when the page is opened through the internet (e.g. a Cloudflare Tunnel) – once per device. The home network, Home Assistant and the Claude Gateway need no code. Without a code, internet access is blocked.
network:
  8097/tcp: Downloader and library on your home network
